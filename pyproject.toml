[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "listener"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "faster-whisper>=1.1.0",
    "sounddevice>=0.5.0",
    "pynput>=1.7.7",
    "pyobjc-framework-Quartz>=10.3",
    "pyobjc-framework-Cocoa>=10.3",
    "pyobjc-framework-ApplicationServices>=10.3",
    "pyyaml>=6.0.1",
    "pydantic>=2.6.0",
    "requests>=2.32.0",
    "numpy>=1.26.0",
]

[tool.uv]
resolution = "highest"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
extend-select = [
    "E",
    "W",
    "C90",
    "I",
    "N",
    "D",
    "UP",
    "YTT",
    "ASYNC",
    "S",
    "BLE",
    "FBT",
    "B",
    "A",
    "COM",
    "C4",
    "DTZ",
    "T10",
    "DJ",
    "EM",
    "EXE",
    "FA",
    "ISC",
    "ICN",
    "LOG",
    "G",
    "INP",
    "PIE",
    "PYI",
    "PT",
    "Q",
    "RSE",
    "RET",
    "SLF",
    "SLOT",
    "SIM",
    "TID",
    "TC",
    "INT",
    "ARG",
    "PTH",
    "TD",
    "FIX",
    "PD",
    "PGH",
    "PL",
    "TRY",
    "FLY",
    "NPY",
    "FAST",
    "AIR",
    "PERF",
    "FURB",
    "RUF",
]
ignore = [
    "E501",
    "D1",
    "FBT003",
    "D203",
    "D212",
    "D401",
    "S311",
    "PERF401",
    "RET504",
    "FA102",
    "TRY003",
    "EM101",
    "COM812",
]

[tool.ruff.lint.per-file-ignores]
"listener/macos.py" = ["N802", "PLW0642", "BLE001"]
"listener/cleanup.py" = ["S603", "SIM115"]
